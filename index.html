<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shoe Store Admin</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .nav { margin-bottom: 20px; text-align: center; }
        .nav a { margin: 0 10px; text-decoration: none; color: #666; font-weight: bold; }
        .product-card {
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
            display: grid;
            grid-template-columns: 90px 1fr auto;
            gap: 14px;
            align-items: center;
        }

        .product-img {
            width: 90px;
            height: 70px;
            border-radius: 10px;
            border: 1px solid #eee;
            object-fit: cover;
            background: #fafafa;
        }

        .product-title { font-weight: 700; font-size: 16px; }
        .product-meta { color: #666; font-size: 13px; margin-top: 4px; }
        .price { font-weight: 700; }

        .btn { background: #28a745; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 8px; }
        .btn-buy { background: #007bff; }
        .btn-buy:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="#">Catalog</a> | <a href="#">Orders</a> | <a href="#">Profile</a> | <a href="#">Admin</a>
        </div>
        <h1>Shoe Store Catalog</h1>
        <div id="products-list">Loading products...</div>
    </div>

    <script>
        const PLACEHOLDER_IMG = "https://via.placeholder.com/180x140?text=Shoe";

        function getImageUrl(p) {
            return p.imageUrl || p.image || p.img || PLACEHOLDER_IMG;
        }

        async function loadProducts() {
            try {
                const response = await fetch('http://localhost:3000/api/products');
                const products = await response.json();
                const list = document.getElementById('products-list');
                list.innerHTML = '';

                products.forEach(p => {
                    const imgUrl = getImageUrl(p);

                    const div = document.createElement('div');
                    div.className = 'product-card';
                    div.innerHTML = `
                        <img class="product-img"
                             src="${imgUrl}"
                             alt="${p.brand || ''} ${p.model || ''}"
                             onerror="this.src='${PLACEHOLDER_IMG}'" />

                        <div>
                            <div class="product-title">
                                ${p.brand} ${p.model}
                                <span class="price">- $${p.base_price ?? 0}</span>
                            </div>
                            <div class="product-meta">Category: ${p.category || '-'}</div>
                        </div>

                        <button class="btn btn-buy" onclick="buy('${p._id}')">Buy</button>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                document.getElementById('products-list').innerHTML = "Error: Make sure server.js is running!";
            }
        }

        async function buy(id) {
            await fetch('http://localhost:3000/api/products/reduce-stock', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ productId: id, size: 42 })
            });
            loadProducts();
        }

        loadProducts();
    </script>
</body>
</html>
